spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
    # use create-drop when you want to reset the database table with original seed data and stats
    # ddl-auto: create-drop
      ddl-auto: update
    show-sql: false

server:
  port: ${PORT:8080}

anthropic:
  api-key: ${ANTHROPIC_API_KEY}